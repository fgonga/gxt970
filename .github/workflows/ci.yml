name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config libxkbcommon-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bins
      - run: cargo test --lib
      - uses: actions/upload-artifact@v4
        with:
          name: gxt970-${{ runner.os }}
          path: |
            target/release/gxt970
            target/release/gxt970-ui
            target/release/gxt970.exe
            target/release/gxt970-ui.exe
          if-no-files-found: ignore
